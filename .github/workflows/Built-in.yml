name: 生产构建
env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android12'
  KERNEL_VERSION: '5.10'
  KERNEL_NAME: 'Xinran_MI-Dev'
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支'
        required: true
        default: master
        type: choice
        options:
          - master
          - dev
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
    steps:
      - name: 最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
      
      - name: 缓存 LLVM 工具链
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: aosp-clang
          key: llvm-23.1.2-${{ runner.os }}

      - name: 安装配置环境依赖
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential \
            flex bison \
            dwarves \
            libssl-dev \
            libelf-dev \
            bc \
            python3 \
            python-is-python3 \
            make \
            cmake \
            zip \
            curl \
            wget \
            gnupg \
            gcc-multilib \
            g++-multilib \
            ccache \
            rsync \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf \
            neofetch
          lscpu
          neofetch
          if [ ! -d aosp-clang ]; then
            wget -O LLVM-23.1.2-Linux-X64.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-Linux-X64.tar.xz
            tar -xvaf LLVM-23.1.2-Linux-X64.tar.xz
            mv LLVM-23.1.2-Linux-X64 aosp-clang
            rm -rf ./LLVM-23.1.2-Linux-X64.tar.xz
          else
            echo "命中 LLVM 缓存，跳过下载"
          fi
          echo "AOSP_CLANG_PATH=$(pwd)/aosp-clang" >> $GITHUB_ENV
          echo "PATH=$(pwd)/aosp-clang/bin:$PATH" >> $GITHUB_ENV
      - name: 初始化源码仓库
        run: |
          rm -rf kernel_workspace && mkdir kernel_workspace && cd kernel_workspace
          git clone --depth=1 https://github.com/Winkmoon/android_kernel_xiaomi_diting -b ${{ github.event.inputs.branch || 'master' }} common
          rm common/android/abi_gki_protected_exports_* || true
      
      - name: 集成ReSukiSU
        id: ksu_version
        run: |
          cd kernel_workspace/common
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/xiaomi_diting_defconfig
          echo "CONFIG_KSU_TOOLKIT_SUPPORT=y" >> ./arch/arm64/configs/xiaomi_diting_defconfig
          echo "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y" >> ./arch/arm64/configs/xiaomi_diting_defconfig
          echo "CONFIG_KSU_TRACEPOINT_HOOK=y" >> ./arch/arm64/configs/xiaomi_diting_defconfig

      
      - name: 添加制作名称
        run: |
          cd kernel_workspace
          cd common
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            for f in ./arch/arm64/configs/xiaomi_diting_defconfig; do
              sed -i "s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"-${{ github.event.inputs.kernel_suffix }}\"/" "$f"
            done
          fi
      
      - name: 缓存 ccache 编译产物
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: 缓存编译输出目录 out/
        uses: actions/cache@v4
        with:
          path: kernel_workspace/common/out
          key: out-${{ github.sha }}
          restore-keys: |
            out-

      - name: 构建内核
        continue-on-error: true
        run: |
          cd kernel_workspace/common
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export PATH=$AOSP_CLANG_PATH/bin:$PATH
          export LLVM=1
          export LLVM_IAS=0
          export KCFLAGS="-Wno-error -Wno-deprecated-declarations"
          export KBUILD_BUILD_VERSION="0"
          # 用提交时间而不是当前时间：既保持可复现，又不让 ccache 每次全失效
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export CCACHE_DIR=$HOME/.ccache
          export CCACHE_MAXSIZE=2G
          export CCACHE_COMPRESS=true
          export KBUILD_BUILD_USER=XinRan♡
          export KBUILD_BUILD_HOST=Bai
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="ccache clang" BUILD_CONFIG=build.config.gki.aarch64 O=out DEPMOD=depmod xiaomi_diting_defconfig
          scripts/config --file out/.config -e LTO_CLANG -d LTO_NONE -e LTO_CLANG_THIN -d LTO_CLANG_FULL -e THINLTO
          make -j24 O=out ARCH=arm64 CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++" LLVM=1 LLVM_IAS=1
      
      - name: 克隆 AnyKernel3 并打包
        run: |
          cd kernel_workspace
          cd common
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp ../out/arch/arm64/boot/Image ./Image
          zip -r ../AnyKernel3_xiaomi_diting.zip ./*
      
      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ${{ github.workspace }}/kernel_workspace/common/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
      
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ./release_zips
      
